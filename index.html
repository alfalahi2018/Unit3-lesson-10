const CL=7;
const DQ=[['1 How was your work in this unit?',['OK','Good','Excellent']],['2 Which lesson was your favourite?',['Holiday equipment','Team Talk','going to and will','Book Club','Famous railways','Writing an email']],['3 Which parts were difficult for you?',['Vocabulary','Grammar','Listening','Reading','Writing']],['4 What new things can you talk about now?',['Travel items and plans','Trains and railways','School trips','Feelings about the future']],['5 How can you learn better in the next unit?',['Practise every day','Ask more questions','Work in a team']]];
const C={t:'In Unit 3, we learned words for {0} (1) like a suitcase and a passport. We use {1} (2) for plans we have already decided and {2} (3) for quick decisions. We use the Present simple for {3} (4). On the Trans-Siberian railway, you get on in Europe and get {4} (5) in Asia.',o:[['school lessons','holiday equipment','sports'],['must','will','going to'],['will','going to','must'],['pizza','emails','timetables'],['off','on','up']],a:[1,2,0,2,0]};
const nst=()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false,sel:null,fd:{},dq:{}});
let S={step:0,st:A.map(nst)};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const GOOD=()=>tone([523,659,784,1047],.1,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);try{speechSynthesis.cancel()}catch(e){}S.step=k;render()}
function lis(){say(A[S.step].q[S.st[S.step].i].w)}
function rd(){say(CM[A[S.step].q[S.st[S.step].i].c][1])}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();if(q.w)say(q.w);render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){S.st[S.step]=nst();tone([440,523],.1);render()}
function wsel(i){const s=S.st[2],n=12;if(s.sel===null){s.sel=i;tone([600],.06);render();return}
 const a=s.sel,b=i;s.sel=null;const r1=Math.floor(a/n),c1=a%n,r2=Math.floor(b/n),c2=b%n,dr=r2-r1,dc=c2-c1;
 if(a!==b&&(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))){const L=Math.max(Math.abs(dr),Math.abs(dc))+1,sr=Math.sign(dr),sc=Math.sign(dc);let w='',cells=[];for(let k=0;k<L;k++){const r=r1+sr*k,c=c1+sc*k;w+=GRID[r][c];cells.push(r*n+c)}
  const lw=w.toLowerCase(),rw=lw.split('').reverse().join('');const hit=WW.find(x=>(x[0]===lw||x[0]===rw)&&!s.fd[x[0]]);
  if(hit){s.fd[hit[0]]=cells;s.sc=Object.keys(s.fd).length;GOOD();say(hit[1]);render();return}}
 BAD();render()}
function dq(q,i){const s=S.st[6];s.dq[q]=i;s.sc=Object.keys(s.dq).length===5?1:0;tone([660],.08);render()}
function cl(g,i){const s=S.st[CL];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[CL];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,CL).reduce((x,y)=>x+y.sc,0)+(s[CL].chk?C.a.filter((a,g)=>s[CL].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="big-stamp">'+s.sc+' / '+n+'</div><div class="fb" style="justify-content:center">'+(s.sc===n?'WOW! Perfect score!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next page →</button>':'')+'</div></div>';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 const lb=q.pics?'<div class="row" style="justify-content:center"><button class="go alt" onclick="lis()">▶ Listen</button></div>':'';
 const cm=a.cm?'<div class="cm"><b>'+CM[q.c][0]+'</b>'+CM[q.c][1]+'</div><div class="row" style="justify-content:flex-start"><button class="go alt" style="padding:6px 20px;font-size:17px" onclick="rd()">▶ Listen</button></div>':'';
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · WOW: '+s.sc+'</span></div>'+cm+'<div class="q">'+pr+'</div>'+lb+'<div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')">'+(q.pics?ic(o.p,90):'<span>'+o.t+'</span>')+'</button>').join('')+'</div><div class="fb">'+(lk?'<span class="seal'+(ok?'':' no')+'">'+(ok?'WOW!':'OOPS')+'</span><span>The answer is: '+(q.w||q.o[q.a].t)+'. '+(q.ex||'')+'</span>':'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='ws'){const fc={};Object.values(s.fd).forEach(c=>c.forEach(x=>fc[x]=1));const all=Object.keys(s.fd).length===9;return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Found: '+s.sc+' / 9</span></div><div class="learn">Find nine words for travel items. Tap the <b>first letter</b>, then the <b>last letter</b>. Words can go across, down, up or backwards.</div><div class="ws">'+GRID.join('').split('').map((ch,i)=>'<button class="'+(fc[i]?'f':s.sel===i?'s':'')+'" onclick="wsel('+i+')" aria-label="'+ch+'">'+ch+'</button>').join('')+'</div><div class="wl">'+WW.map(w=>'<div class="'+(s.fd[w[0]]?'on':'')+'">'+ic(w[1],36)+'<span>'+(s.fd[w[0]]?w[1]:'? ? ?')+'</span></div>').join('')+'</div><div class="fb">'+(all?'<span class="seal">WOW!</span>You found all nine words!':'')+'</div><div class="row"><button class="go alt" onclick="retry()">Start again</button><button class="go" onclick="go(3)">Travel phrases →</button></div></div>'}
 if(a.type==='diary'){const all=Object.keys(s.dq).length===5;return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>WOW: '+s.sc+'</span></div><div class="learn"><b>Self-assessment:</b> Answer the questions about your work in Unit 3.</div>'+DQ.map((q,k)=>'<div><div class="q2">'+q[0]+'</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:6px">'+q[1].map((x,i)=>'<button class="o'+(s.dq[k]===i?' pk':'')+'" style="padding:8px 12px;font-size:clamp(16px,2.2vw,20px)" onclick="dq('+k+','+i+')"><span>'+x+'</span></button>').join('')+'</div></div>').join('')+(all?'<div class="box"><b>My Unit 3 diary</b><br>My work was <b>'+DQ[0][1][s.dq[0]]+'</b>. My favourite lesson was <b>'+DQ[1][1][s.dq[1]]+'</b>. The difficult part was <b>'+DQ[2][1][s.dq[2]].toLowerCase()+'</b>. Now I can talk about <b>'+DQ[3][1][s.dq[3]].toLowerCase()+'</b>. Next time, I will <b>'+DQ[4][1][s.dq[4]].toLowerCase()+'</b>.</div><button class="go alt" onclick="go(7)">Final task →</button>':'')+'</div>'}
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>Finishing the lesson · Unit 3 review</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+(s.chk?'<div class="big-stamp">'+n+' / 5</div>':'')+'<div class="row"><span style="margin-right:auto;font-size:20px;font-weight:800">'+(s.chk?(n===5?'WOW! You finished Unit 3 like a star!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}
function render(){
 const L=A.length-1;
 document.getElementById('nav').innerHTML='<span>Progress path:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');
